name: CI Verification

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install package and test dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install --no-cache-dir . pytest pytest-asyncio jsonschema

      - name: Run pytest and self-tests
        run: |
          pytest
          python3 ag_bridge.py --self-test
          python3 -m agy_nexus.tools_praxis --self-test

      - name: Check agent parity, catalog schema/docs sync, and build zero-leak showcase
        run: |
          python3 scripts/sync_agents.py --check
          python3 scripts/catalog_sync.py --validate-strict --require-jsonschema
          python3 scripts/catalog_sync.py --render-docs --check
          python3 scripts/build_github_showcase.py

      - name: Smoke-test Docker --stdio JSON-RPC container
        run: |
          IMAGE="agy-nexus-mcp:ci-test"
          docker build -t "$IMAGE" .
          python3 - "$IMAGE" <<'PY'
          import json, select, subprocess, sys, time
          image = sys.argv[1]
          reqs = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-03-26", "capabilities": {}, "clientInfo": {"name": "ci-smoke", "version": "1.0"}}},
              {"jsonrpc": "2.0", "method": "notifications/initialized"},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list"},
              {"jsonrpc": "2.0", "id": 3, "method": "tools/call", "params": {"name": "list_models_and_agents", "arguments": {"style": "ascii", "include_skills": False, "include_rules": False}}},
              {"jsonrpc": "2.0", "id": 4, "method": "tools/call", "params": {"name": "list_saved_sessions", "arguments": {}}},
          ]
          proc = subprocess.Popen(["docker", "run", "--rm", "-i", image, "--stdio"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
          for req in reqs[:2]:
              proc.stdin.write(json.dumps(req) + "\n")
          proc.stdin.flush()
          for req in reqs[2:]:
              proc.stdin.write(json.dumps(req) + "\n")
          proc.stdin.flush()
          parsed = {}
          deadline = time.monotonic() + 25.0
          while len(parsed) < 4 and time.monotonic() < deadline:
              ready, _, _ = select.select([proc.stdout], [], [], max(0.1, deadline - time.monotonic()))
              if not ready:
                  break
              line = proc.stdout.readline()
              if not line:
                  break
              if line.strip():
                  msg = json.loads(line)
                  assert msg.get("jsonrpc") == "2.0"
                  if "id" in msg:
                      parsed[msg["id"]] = msg
          proc.stdin.close()
          stderr = proc.stderr.read()
          assert proc.wait(timeout=15) == 0, stderr
          assert set(parsed.keys()) >= {1, 2, 3, 4}, (parsed, stderr)
          assert "result" in parsed[1] and len(parsed[2]["result"]["tools"]) == 11
          assert "SUBAGENT ROSTER (12)" in parsed[3]["result"]["content"][0]["text"]
          assert '"locked": true' in parsed[4]["result"]["content"][0]["text"]
          print("Docker ci-smoke stdio test OK")
          PY
