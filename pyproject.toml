[project]
name = "agy-nexus-mcp"
version = "2.3.0"
description = "AGY-NEXUS-MCP: Antigravity Mission Control, Cross-Session FTS5 Memory, Dual-Pool Quota Overwatch, Activity Heatmap, Three-Tier ASCII Telemetry & Chromium PWA Dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "pydantic>=2.8.0",
    "psutil>=5.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "ag_bridge.py",
    "ag_bridge_hygiene.py",
    "ag_bridge_inventory.py",
    "ag_bridge_stats.py",
    "ag_bridge_telemetry_scanner.py",
    "ag_bridge_ascii_default.py",
    "ag_bridge_ascii_rich.py",
    "web",
    "skills",
    "host_bridge",
    "scripts",
]
