[project]
name = "agy-nexus-mcp"
version = "2.8.0"
description = "AGY-NEXUS-MCP & AGY-PRAXIS-MCP: Antigravity Mission Control, Local IDE Praxis Doorway, Repo-Prefixed Handoff Queue, Polyglot Semantic Index & 4-Surface Overwatch Dashboard"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "pydantic>=2.8.0",
    "psutil>=5.9.0",
    "python-multipart>=0.0.12",
    "Pillow>=10.4.0",
]

[project.scripts]
agy-nexus-mcp = "agy_nexus.server:main"
agy-praxis-mcp = "agy_nexus.tools_praxis:main"
agy-polyglot-mcp = "agy_nexus.tools_polyglot:main"
ag-bridge = "ag_bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agy_nexus"]
only-include = [
    "src/agy_nexus",
    "ag_bridge.py",
    "LICENSE",
    "NOTICE",
    "CHANGELOG.md",
    "AGENTS.md",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "web",
    "skills",
    "agents",
    "docs",
    "host_bridge",
    "scripts",
]

